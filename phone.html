<script defer src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.8/hls.min.js"></script>
<style>
:root{--bg:#060a1c;--bg2:#101828;--card:#1b2436;--or:#ff9800;--cy:#22c7ff;--tx:#fff;--mu:#8b96aa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#000;color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
#app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:90px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg2);position:sticky;top:0;z-index:20}
header .lg{width:46px;height:46px;border-radius:12px;border:2px solid var(--or);object-fit:cover}
header h1{margin:0;font-size:22px;letter-spacing:2px;direction:ltr}
.burger{background:none;border:0;width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:6px;cursor:pointer}
.burger i{display:block;height:4px;border-radius:3px;background:var(--or)}
.hero{margin:14px 16px;height:200px;border-radius:26px;background:linear-gradient(#222b3d,#0c111d);border:1px solid #2a3550;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero img{height:170px;width:170px;object-fit:contain;filter:drop-shadow(0 0 18px #ff2d2d88)}
.hero .t{position:absolute;right:22px;bottom:16px;font-size:20px;font-weight:700}
.hero button{position:absolute;left:20px;bottom:16px;background:var(--or);color:#fff;border:0;border-radius:14px;padding:12px 26px;font-size:17px;font-weight:700;cursor:pointer}
.tick{background:#0a1730;color:var(--cy);overflow:hidden;white-space:nowrap;padding:14px 0;margin:6px 0 10px}
.tick span{display:inline-block;padding-right:100%;animation:mq 22s linear infinite}
@keyframes mq{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.sec{padding:10px 16px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.sh h2{margin:0;font-size:22px;flex:1}
.pill{background:#1b2336;color:var(--or);border:0;border-radius:20px;padding:8px 18px;font-size:14px;cursor:pointer}
.ib{background:#1b2336;color:#fff;border:0;border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ch{position:relative;display:block;width:100%;border-radius:20px;overflow:hidden;background:var(--card);cursor:pointer;border:0;padding:0;color:#fff}
.ch::before{content:'';display:block;padding-bottom:100%}
.ch img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ch .ini{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:700;background:linear-gradient(135deg,#1a3f8f,#0a1a45)}
.ch .nm{position:absolute;inset:auto 0 0 0;padding:16px 4px 8px;text-align:center;font-size:13px;font-weight:700;background:linear-gradient(transparent,#000c);direction:ltr}
.ch .ed{position:absolute;top:6px;left:6px;background:var(--or);border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px}
.add::before{display:none}.add{aspect-ratio:1;border:2px dashed #3a4766;background:transparent;color:var(--or);font-size:34px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.add small{font-size:12px}
.empty{color:var(--mu);text-align:center;padding:20px}
.addsec{display:block;margin:16px auto;background:var(--or);color:#fff;border:0;border-radius:14px;padding:12px 24px;font-size:16px;cursor:pointer}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--bg2);display:flex;justify-content:space-around;padding:8px 0 10px;z-index:20;border-top:1px solid #1d2840}
nav button{background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;cursor:pointer;padding:4px 8px}
nav button .ic{width:50px;height:38px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:24px}
nav button.on{color:var(--cy)}nav button.on .ic{background:#0e3a46}
.ov{position:fixed;inset:0;background:#000c;z-index:50;display:none;align-items:center;justify-content:center;padding:14px}
.ov.show{display:flex}
.box{background:var(--bg2);border-radius:20px;padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto}
.box h3{margin:0 0 12px}
.box label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.box input[type=text],.box input[type=url],.box textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #2a3550;background:#0a1020;color:#fff;font-size:15px;font-family:inherit}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:12px;border:0;border-radius:12px;font-size:15px;cursor:pointer;color:#fff;background:#2a3550}
.row .pr{background:var(--or)}.row .dg{background:#c62828}
.prev{width:110px;height:110px;border-radius:16px;object-fit:cover;background:#0a1020;display:block;margin:6px 0}
.drawer button{display:block;width:100%;text-align:right;background:#1b2336;color:#fff;border:0;border-radius:12px;padding:14px;margin-top:8px;font-size:15px;cursor:pointer}
.pl{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;max-width:520px;margin:auto}
.pl.show{display:flex}
.plh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2)}
.plh span{flex:1;font-weight:700;font-size:17px;direction:ltr;text-align:center}
.plh button{background:#1b2336;color:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:18px;cursor:pointer}
.vw{position:relative;background:#000;aspect-ratio:16/9;width:100%}
video{width:100%;height:100%;background:#000;display:block}
#spin{position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px;border:4px solid #fff3;border-top-color:var(--or);border-radius:50%;animation:sp .8s linear infinite;display:none;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
#pMsg{position:absolute;inset:auto 0 8px 0;text-align:center;color:#fff;font-size:13px;padding:0 10px;text-shadow:0 0 6px #000;pointer-events:none}
.pls{padding:12px 16px 4px;color:var(--mu);font-size:13px}
#pList{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:8px 16px 20px;overflow:auto;flex:1;align-content:start}
#pList .ch{border-radius:14px}#pList .ch.cur{outline:3px solid var(--or)}#pList .ch .nm{font-size:10px;padding-top:10px}#pList .ch .ini{font-size:28px}
.badge{background:var(--or);color:#fff;border-radius:10px;padding:3px 10px;font-size:12px;margin:0 8px}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;z-index:99;display:none}
.about{padding:30px 20px;text-align:center}.about img{width:180px;border-radius:30px}
</style>
</head>
<body>

<script>
const KEY='hardiTV_v1';
const CLOUD_URL='https://script.google.com/macros/s/AKfycbyNvWi4RQcNSVHt6nBNjqXA7BbGw9avs70UqGARxHO_OP-NnnN8nGzCH6y-4ATI6teU/exec'; // بۆ تەلەفزیۆن: لینکی Apps Script لێرە دابنێ

const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAGES=[['home','کەناڵەکان','📡'],['movies','فیلمەکان','🎬'],['series','زنجیرە دراما','📺'],['about','دەربارە','ℹ️']];
const def=()=>({ticker:'بەخێربێیت بۆ هەردی تیڤی - باشترین خزمەتگوزاری بە باشترین کوالێتی',hero:'فیلمەکان',
pages:{home:[{id:uid(),name:'Kurdish Channels',channels:[]},{id:uid(),name:'Kurdish TV',channels:[]}],movies:[{id:uid(),name:'Movies',channels:[]}],series:[{id:uid(),name:'Series',channels:[]}]}});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){S=def()}
let C={url:CLOUD_URL,pass:''};
try{const s=JSON.parse(localStorage.getItem('hardiTV_cloud'))||{};if(s.url)C.url=s.url;if(s.pass)C.pass=s.pass}catch(e){}
try{const q=new URLSearchParams(location.search).get('cloud');if(q){C.url=q;saveC()}}catch(e){}
function saveC(){try{localStorage.setItem('hardiTV_cloud',JSON.stringify(C))}catch(e){}}
let pt,tt;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
function push(now){if(!C.url||!C.pass)return;clearTimeout(pt);pt=setTimeout(async()=>{try{const r=await fetch(C.url,{method:'POST',body:JSON.stringify({pass:C.pass,data:S})});const j=await r.json();toast(j.ok?'✔ هاوتاکرا':'✖ پاسۆرد هەڵەیە')}catch(e){toast('✖ هاوتاکردن سەرنەکەوت')}},now?0:1500)}
async function pull(manual){if(!C.url)return;try{const r=await fetch(C.url+(C.url.includes('?')?'&':'?')+'t='+Date.now());const d=await r.json();if(d&&d.pages){S=d;warm();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 if(manual||(!editMode&&!$('#ovPlay').classList.contains('show')&&!$('#ovEdit').classList.contains('show')))render();if(manual)toast('✔ نوێکرایەوە')}else if(manual)toast('داتا لە Google بەتاڵە، یەکەمجار «ناردن» بکە')}catch(e){if(manual)toast('✖ نەتوانرا پەیوەندی بکرێت')}}

var _pc={};
function warm(){try{if(!S||!S.pages)return;var n=0;for(var p in S.pages)S.pages[p].forEach(function(s){s.channels.forEach(function(c){
 var m=/^(https?:\/\/[^\/]+)/i.exec((c.url||'').trim());if(!m||n>=10)return;
 [m[1],m[1].replace('http://','https://')].forEach(function(o){if(_pc[o])return;_pc[o]=1;n++;var l=document.createElement('link');l.rel='preconnect';l.href=o;document.head.appendChild(l)})})})}catch(e){}}
let page='home',editMode=false,open={};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('شوێنی هەڵگرتن پڕە! لۆگۆی بچووکتر بەکاربهێنە.')}push()};

function renderNav(){
 $('#nav').innerHTML=PAGES.map(p=>`<button class="${p[0]==page?'on':''}" data-p="${p[0]}"><span class="ic">${p[2]}</span>${p[1]}</button>`).join('');
 $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});
}
function chCard(c,sid){
 const inner=c.logo?`<img src="${esc(c.logo)}" alt="" loading="lazy" style="object-fit:${c.fit=='contain'?'contain':c.fit=='fill'?'fill':'cover'}">`:`<div class="ini">${esc((c.name||'?').trim()[0]||'?')}</div>`;
 return `<button class="ch" data-s="${sid}" data-c="${c.id}">${inner}<div class="nm">${esc(c.name)}</div>${editMode?'<span class="ed">✎</span>':''}</button>`;
}
function render(){

function find(sid,cid){for(const p in S.pages)for(const s of S.pages[p])for(const c of s.channels)if(c.id==cid)return c}
function editCh(sid,cid){
 const sec=S.pages[page].find(s=>s.id==sid);const c=cid?sec.channels.find(x=>x.id==cid):{name:'',logo:'',url:''};
 let logo=c.logo||'';let fit=['contain','fill'].includes(c.fit)?c.fit:'cover';
 const box=$('#editBox');
 box.innerHTML=`<h3>${cid?'دەستکاری کەناڵ':'زیادکردنی کەناڵ'}</h3>
 <label>ناوی کەناڵ</label><input type="text" id="fN" value="${esc(c.name)}">
 <label>لینکی پەخش (m3u8 / mp4)</label><input type="url" id="fU" dir="ltr" value="${esc(c.url)}" placeholder="https://...">
 <label>لۆگۆی کەناڵ</label><img class="prev" id="fP" ${logo?`src="${esc(logo)}"`:'style="display:none"'}>
 <input type="file" id="fF" accept="image/*">
 <label>یان لینکی وێنە</label><input type="url" id="fL" dir="ltr" value="${logo.startsWith('data:')?'':esc(logo)}" placeholder="https://...logo.png">
 <label>شێوازی لۆگۆ</label><select id="fT" style="width:100%;padding:11px;border-radius:10px;border:1px solid #2a3550;background:#0a1020;color:#fff;font-size:15px"><option value="cover">پڕ بە تەواوی کارتەکە (بێ لار بوونەوە)</option><option value="fill">کێشان بۆ پڕکردنەوەی کارتەکە (ڕاستەوخۆ)</option><option value="contain">تەواو بە بێ بڕین</option></select>
 ${cid?`<label>گۆڕینی شوێن لە ناو بەشەکە</label><div class="row" style="margin-top:4px"><button id="mvP">→ پێشتر</button><button id="mvN">دواتر ←</button></div>
 <label>گواستنەوە بۆ بەشێکی تر</label><select id="mvS" style="width:100%;padding:11px;border-radius:10px;border:1px solid #2a3550;background:#0a1020;color:#fff;font-size:15px"><option value="">-- هەڵبژێرە --</option>${S.pages[page].filter(s=>s.id!=sid).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>`:''}

 $('#ovEdit').classList.add('show');
 $('#fT').value=fit;
 const prev=u=>{const p=$('#fP');p.style.objectFit=fit;if(u){p.src=u;p.style.display='block'}else p.style.display='none'};
 $('#fT').onchange=e=>{fit=e.target.value;prev(logo)};
 $('#fF').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=500,k=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);logo=cv.toDataURL('image/webp',.85);if(!logo.startsWith('data:image/webp'))logo=cv.toDataURL('image/jpeg',.85);$('#fL').value='';prev(logo)};im.src=r.result};r.readAsDataURL(f)};

 $('#fX').onclick=()=>$('#ovEdit').classList.remove('show');
 if(cid){
  const done=()=>{save();$('#ovEdit').classList.remove('show');render();toast('✔ جێگۆڕکێ کرا')};
  const mv=d=>{const a=sec.channels,i=a.findIndex(x=>x.id==cid),j=i+d;if(j<0||j>=a.length){toast('ناتوانرێت زیاتر بجووڵێت');return}const tmp=a[i];a[i]=a[j];a[j]=tmp;done()};
  $('#mvP').onclick=()=>mv(-1);$('#mvN').onclick=()=>mv(1);

 $('#fS').onclick=()=>{const n=$('#fN').value.trim();if(!n){alert('ناوی کەناڵ بنووسە');return}
  const o={id:cid||uid(),name:n,url:$('#fU').value.trim(),logo,fit};
  if(cid)Object.assign(c,o);else sec.channels.push(o);
  save();$('#ovEdit').classList.remove('show');render()};
}
let hls,tok=0;
function secOf(cid){for(const p in S.pages)for(const s of S.pages[p])if(s.channels.some(c=>c.id==cid))return s}
function play(sid,cid){
 const c=find(sid,cid);if(!c)return;
 const v=$('#vid');
 $('#pTitle').textContent=c.name;$('#pMsg').textContent='';
 $('#ovPlay').classList.add('show');
 const sec=secOf(cid);
 $('#pList').innerHTML=sec?sec.channels.map(x=>{const q=chCard(x,sec.id).replace('class="ch"','class="ch'+(x.id==cid?' cur':'')+'"').replace('<span class="ed">✎</span>','');return q}).join(''):'';
 $('#pList').querySelectorAll('.ch[data-c]').forEach(b=>b.onclick=()=>play(null,b.dataset.c));
 stop();
 const u=(c.url||'').trim();
 if(!u){$('#pMsg').textContent='هێشتا لینکی پەخش دانەنراوە.';return}
 const urls=u.startsWith('http://')?[u.replace('http://','https://'),u]:[u];
 const isH=/\.m3u8/i.test(u),nat=v.canPlayType('application/vnd.apple.mpegurl');
 const at=[];
 urls.forEach(x=>{if(!isH)at.push([x,'n']);else{if(nat)at.push([x,'n']);if(window.Hls&&Hls.isSupported())at.push([x,'h'])}});
 const my=++tok;let i=0,t0;
 const sp=$('#spin');sp.style.display='block';
 function next(){
  if(my!=tok)return;
  if(i>=at.length){sp.style.display='none';$('#pMsg').textContent='ناتوانرێت پەخش بکرێت. لینکەکە یان ئینتەرنێت یان CORS بپشکنە.';return}
  const [x,m]=at[i++];cleanup();
  clearTimeout(t0);t0=setTimeout(()=>{if(my==tok&&v.readyState<2)next()},5000);
  if(m=='h'){hls=new Hls({startLevel:0,maxBufferLength:8,backBufferLength:10,liveSyncDurationCount:2,lowLatencyMode:false,enableWorker:true,startFragPrefetch:true,manifestLoadingTimeOut:6000,manifestLoadingMaxRetry:1,levelLoadingMaxRetry:1,fragLoadingMaxRetry:2});hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)next()});hls.loadSource(x);hls.attachMedia(v)}
  else{v.onerror=()=>next();v.preload='auto';v.src=x}
  go();
 }
 function go(){v.muted=false;const p=v.play();if(p)p.catch(()=>{v.muted=true;v.play().catch(()=>{})})}
 v.onplaying=()=>{if(my==tok){sp.style.display='none';$('#pMsg').textContent='';clearTimeout(t0)}};
 v.onwaiting=()=>{if(my==tok)sp.style.display='block'};
 next();
}
function cleanup(){const v=$('#vid');v.onerror=null;if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load()}
function stop(){tok++;cleanup()}
$('#pFs').onclick=()=>{const v=$('#vid');(v.requestFullscreen||v.webkitRequestFullscreen||v.webkitEnterFullscreen||function(){}).call(v)};
$('#pClose').onclick=()=>{stop();$('#ovPlay').classList.remove('show')};
$('#menuBtn').onclick=()=>{$('#mEdit').textContent=editMode?'✅ دەرچوون لە دۆخی دەستکاری':'✏️ چالاککردنی دەستکاری (زیادکردن/گۆڕین)';$('#ovMenu').classList.add('show')};
$('#mClose').onclick=()=>$('#ovMenu').classList.remove('show');
$('#mEdit').onclick=()=>{editMode=!editMode;$('#ovMenu').classList.remove('show');render()};
$('#mTick').onclick=()=>{const n=prompt('نووسینی بانەر:',S.ticker);if(n!==null){S.ticker=n;save();render()}};
$('#mCloud').onclick=()=>{
 $('#ovMenu').classList.remove('show');
 const link=/^https?:/.test(location.href)&&C.url?location.origin+location.pathname+'?cloud='+encodeURIComponent(C.url):'';
 $('#editBox').innerHTML=`<h3>☁️ هاوتاکردن لەگەڵ Google</h3>
 <label>لینکی Apps Script (کۆتایی /exec)</label><input type="url" id="cU" dir="ltr" value="${esc(C.url)}" placeholder="https://script.google.com/macros/s/.../exec">
 <label>پاسۆرد (بۆ دەستکاریکردن؛ لە تەلەفزیۆن پێویست نییە)</label><input type="text" id="cP" dir="ltr" value="${esc(C.pass)}">
 ${link?`<label>لینکی تەلەفزیۆن (بیکەرەوە لە وێبگەڕی TV)</label><textarea id="cL" rows="3" dir="ltr" readonly>${esc(link)}</textarea>`:''}
 <div class="row"><button id="cX">داخستن</button><button id="cPl">وەرگرتن</button><button class="pr" id="cPs">ناردن</button></div>`;
 $('#ovEdit').classList.add('show');
 const sv=()=>{C.url=$('#cU').value.trim();C.pass=$('#cP').value.trim();saveC()};
 $('#cX').onclick=()=>{sv();$('#ovEdit').classList.remove('show')};
 $('#cPl').onclick=()=>{sv();pull(true)};
 $('#cPs').onclick=()=>{sv();if(!C.url||!C.pass){toast('لینک و پاسۆرد بنووسە');return}push(true)};
};
$('#mExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='hardi-tv-backup.json';a.click()};
$('#mImp').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.pages)throw 0;S=d;save();$('#ovMenu').classList.remove('show');render()}catch(x){alert('فایلەکە دروست نییە')}};r.readAsText(f)};
$('#mReset').onclick=()=>{if(confirm('هەموو کەناڵ و بەشەکان دەسڕدرێنەوە. دڵنیایت؟')){S=def();save();$('#ovMenu').classList.remove('show');render()}};
warm();render();pull();
setInterval(()=>{if(!editMode)pull()},120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!editMode)pull()});
</script>
</body>
